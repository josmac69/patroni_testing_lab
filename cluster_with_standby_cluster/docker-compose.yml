services:
  # ==========================================
  # Primary (Active) Cluster DCS
  # ==========================================
  primary-etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: primary-etcd
    command: >
      etcd --name primary-etcd
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://primary-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://primary-etcd:2380
      --initial-cluster primary-etcd=http://primary-etcd:2380
      --initial-cluster-token primary-etcd-cluster-token
      --initial-cluster-state new
    ports:
      - "2379:2379"
    networks:
      - patroni-net

  # ==========================================
  # Standby Cluster DCS
  # ==========================================
  standby-etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: standby-etcd
    command: >
      etcd --name standby-etcd
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://standby-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://standby-etcd:2380
      --initial-cluster standby-etcd=http://standby-etcd:2380
      --initial-cluster-token standby-etcd-cluster-token
      --initial-cluster-state new
    ports:
      - "2389:2379"
    networks:
      - patroni-net

  # ==========================================
  # Primary Patroni Cluster Nodes
  # ==========================================
  primary-patroni1:
    build: .
    container_name: primary-patroni1
    hostname: primary-patroni1
    environment:
      PATRONI_NAME: primary-patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: primary-patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: primary-patroni1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: primary-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - primary-pgdata1:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - primary-etcd
    networks:
      - patroni-net

  primary-patroni2:
    build: .
    container_name: primary-patroni2
    hostname: primary-patroni2
    environment:
      PATRONI_NAME: primary-patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: primary-patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: primary-patroni2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: primary-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - primary-pgdata2:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - primary-etcd
    networks:
      - patroni-net

  primary-patroni3:
    build: .
    container_name: primary-patroni3
    hostname: primary-patroni3
    environment:
      PATRONI_NAME: primary-patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: primary-patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: primary-patroni3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: primary-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - primary-pgdata3:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - primary-etcd
    networks:
      - patroni-net

  # ==========================================
  # Standby Patroni Cluster Nodes
  # ==========================================
  standby-patroni1:
    build: .
    container_name: standby-patroni1
    hostname: standby-patroni1
    environment:
      PATRONI_NAME: standby-patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: standby-patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: standby-patroni1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: standby-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - standby-pgdata1:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - standby-etcd
    networks:
      - patroni-net

  standby-patroni2:
    build: .
    container_name: standby-patroni2
    hostname: standby-patroni2
    environment:
      PATRONI_NAME: standby-patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: standby-patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: standby-patroni2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: standby-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - standby-pgdata2:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - standby-etcd
    networks:
      - patroni-net

  standby-patroni3:
    build: .
    container_name: standby-patroni3
    hostname: standby-patroni3
    environment:
      PATRONI_NAME: standby-patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: standby-patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: standby-patroni3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: standby-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - standby-pgdata3:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - standby-etcd
    networks:
      - patroni-net

  # ==========================================
  # Routers / Load Balancers
  # ==========================================
  primary-haproxy:
    image: haproxy:alpine
    container_name: primary-haproxy
    ports:
      - "5000:5000" # Primary Write Endpoint
      - "5001:5001" # Primary Read Endpoint
      - "7000:7000" # Primary Stats Endpoint
    volumes:
      - ./haproxy-primary.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - primary-patroni1
      - primary-patroni2
      - primary-patroni3
    networks:
      - patroni-net

  standby-haproxy:
    image: haproxy:alpine
    container_name: standby-haproxy
    ports:
      - "6000:5000" # Standby Write Endpoint (Read-only under standby mode)
      - "6001:5001" # Standby Read Endpoint
      - "8000:7000" # Standby Stats Endpoint
    volumes:
      - ./haproxy-standby.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - standby-patroni1
      - standby-patroni2
      - standby-patroni3
    networks:
      - patroni-net

  # ==========================================
  # Clients
  # ==========================================
  primary-client:
    build: .
    container_name: patroni-client
    restart: always
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DB_HOST: primary-haproxy
      DB_PORT: 5000
    entrypoint: ["python3", "-u", "/scripts/ingest.py"]
    depends_on:
      - primary-haproxy
    networks:
      - patroni-net

networks:
  patroni-net:
    driver: bridge

volumes:
  primary-pgdata1:
  primary-pgdata2:
  primary-pgdata3:
  standby-pgdata1:
  standby-pgdata2:
  standby-pgdata3:
