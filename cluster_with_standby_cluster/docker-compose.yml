services:
  # ==========================================
  # Primary (Active) Cluster DCS
  # ==========================================
  berlin-etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: berlin-etcd
    command: >
      etcd --name berlin-etcd
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://berlin-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://berlin-etcd:2380
      --initial-cluster berlin-etcd=http://berlin-etcd:2380
      --initial-cluster-token berlin-etcd-cluster-token
      --initial-cluster-state new
    ports:
      - "2379:2379"
    networks:
      - patroni-net

  # ==========================================
  # Standby Cluster DCS
  # ==========================================
  bonn-etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: bonn-etcd
    command: >
      etcd --name bonn-etcd
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://bonn-etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://bonn-etcd:2380
      --initial-cluster bonn-etcd=http://bonn-etcd:2380
      --initial-cluster-token bonn-etcd-cluster-token
      --initial-cluster-state new
    ports:
      - "2389:2379"
    networks:
      - patroni-net

  # ==========================================
  # Primary Patroni Cluster Nodes
  # ==========================================
  berlin-patroni1:
    build: .
    container_name: berlin-patroni1
    hostname: berlin-patroni1
    environment:
      PATRONI_NAME: berlin-patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: berlin-patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: berlin-patroni1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: berlin-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - berlin-pgdata1:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - berlin-etcd
    networks:
      - patroni-net

  berlin-patroni2:
    build: .
    container_name: berlin-patroni2
    hostname: berlin-patroni2
    environment:
      PATRONI_NAME: berlin-patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: berlin-patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: berlin-patroni2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: berlin-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - berlin-pgdata2:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - berlin-etcd
    networks:
      - patroni-net

  berlin-patroni3:
    build: .
    container_name: berlin-patroni3
    hostname: berlin-patroni3
    environment:
      PATRONI_NAME: berlin-patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: berlin-patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: berlin-patroni3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: berlin-etcd:2379
    volumes:
      - ./patroni-berlin.yml:/etc/patroni/patroni.yml:ro
      - berlin-pgdata3:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - berlin-etcd
    networks:
      - patroni-net

  # ==========================================
  # Standby Patroni Cluster Nodes
  # ==========================================
  bonn-patroni1:
    build: .
    container_name: bonn-patroni1
    hostname: bonn-patroni1
    environment:
      PATRONI_NAME: bonn-patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: bonn-patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: bonn-patroni1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: bonn-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - bonn-pgdata1:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - bonn-etcd
    networks:
      - patroni-net

  bonn-patroni2:
    build: .
    container_name: bonn-patroni2
    hostname: bonn-patroni2
    environment:
      PATRONI_NAME: bonn-patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: bonn-patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: bonn-patroni2:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: bonn-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - bonn-pgdata2:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - bonn-etcd
    networks:
      - patroni-net

  bonn-patroni3:
    build: .
    container_name: bonn-patroni3
    hostname: bonn-patroni3
    environment:
      PATRONI_NAME: bonn-patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: bonn-patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: bonn-patroni3:5432
      PATRONI_POSTGRESQL_DATA_DIR: /data/patroni
      PATRONI_ETCD3_HOSTS: bonn-etcd:2379
    volumes:
      - ./patroni-bonn.yml:/etc/patroni/patroni.yml:ro
      - bonn-pgdata3:/data/patroni
      - ./scripts:/scripts:ro
    depends_on:
      - bonn-etcd
    networks:
      - patroni-net

  # ==========================================
  # Routers / Load Balancers
  # ==========================================
  berlin-haproxy:
    image: haproxy:alpine
    container_name: berlin-haproxy
    ports:
      - "5000:5000" # Primary Write Endpoint
      - "5001:5001" # Primary Read Endpoint
      - "7000:7000" # Primary Stats Endpoint
    volumes:
      - ./haproxy-berlin.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - berlin-patroni1
      - berlin-patroni2
      - berlin-patroni3
    networks:
      - patroni-net

  bonn-haproxy:
    image: haproxy:alpine
    container_name: bonn-haproxy
    ports:
      - "6000:5000" # Standby Write Endpoint (Read-only under standby mode)
      - "6001:5001" # Standby Read Endpoint
      - "8000:7000" # Standby Stats Endpoint
    volumes:
      - ./haproxy-bonn.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - bonn-patroni1
      - bonn-patroni2
      - bonn-patroni3
    networks:
      - patroni-net

  # ==========================================
  # Clients
  # ==========================================
  berlin-client:
    build: .
    container_name: berlin-client
    restart: always
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DB_HOST: berlin-haproxy
      DB_PORT: 5000
    entrypoint: ["python3", "-u", "/scripts/ingest.py"]
    depends_on:
      - berlin-haproxy
    networks:
      - patroni-net

networks:
  patroni-net:
    driver: bridge

volumes:
  berlin-pgdata1:
  berlin-pgdata2:
  berlin-pgdata3:
  bonn-pgdata1:
  bonn-pgdata2:
  bonn-pgdata3:
