# Lab pgBackRest configuration - shared-volume repository.
# For production replace the [global] repo block with a dedicated repo host
# (TLS) or object storage (repo1-s3-* / repo1-azure-* / repo1-gcs-*).
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
start-fast=y
log-level-console=info
compress-type=zst

[lab]
pg1-path=/var/lib/postgresql/data/pgdata
