# Merge these keys into patroni.yml.tmpl of the enhanced lab.

# 1) replica creation preference: repository first, primary as fallback
postgresql:
  create_replica_methods:
    - pgbackrest
    - basebackup
  pgbackrest:
    command: /usr/bin/pgbackrest --stanza=lab --delta restore
    keep_data: true
    no_params: true
  basebackup:
    checkpoint: fast

