# ===========================================================================
# HAProxy routing for the enhanced lab.
#
#   :5000  writes -> the node whose Patroni REST API answers 200 on /primary
#   :5001  reads  -> nodes answering 200 on /replica, round-robin
#   :7000  human stats UI
#   :8404  native Prometheus exporter (scraped by the monitoring stack)
#
# Teaching notes:
#   * Health checks hit Patroni (:8008), never PostgreSQL itself. Patroni is
#     the single source of truth about the role of each node.
#   * `on-marked-down shutdown-sessions` on the write backend force-closes
#     connections to a demoted primary. Without it, clients holding open
#     connections would keep talking to a read-only ex-primary until their
#     next reconnect.
#   * `inter 3s fall 3 rise 2` means detection of a dead primary takes up to
#     ~9s on top of Patroni's own failover time. Tighten it and re-measure
#     RTO with the harness to see the routing layer's contribution.
# ===========================================================================

global
    maxconn 300
    log stdout format raw local0

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

frontend prometheus
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    no log

listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008
