# Scrapes:
#   * Patroni's native /metrics on the REST API port 8008 (available since
#     Patroni 2.1.0) - leader flag, timeline, xlog positions, pending_restart
#   * postgres_exporter sidecars (9187)
#   * etcd built-in metrics (2379/metrics) - watch quorum health live
#   * HAProxy native exporter (8404/metrics) - backend up/down transitions
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: ["patroni1:8008", "patroni2:8008", "patroni3:8008"]

  - job_name: postgres
    static_configs:
      - targets: ["pgexporter1:9187", "pgexporter2:9187", "pgexporter3:9187"]

  - job_name: etcd
    static_configs:
      - targets: ["etcd1:2379", "etcd2:2379", "etcd3:2379"]

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy:8404"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter1:9100", "node-exporter2:9100", "node-exporter3:9100"]
