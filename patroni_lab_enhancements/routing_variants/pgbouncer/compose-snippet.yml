# Add to enhanced_3_nodes/docker-compose.yml (services:) - PgBouncer in
# transaction pooling mode in front of the HAProxy write endpoint.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: pgbouncer
    networks: [labnet]
    ports: ["6432:6432"]
    environment:
      DB_HOST: haproxy
      DB_PORT: "5000"
      DB_USER: postgres
      DB_PASSWORD: postgres
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on: [haproxy]
