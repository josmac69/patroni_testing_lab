; Reference configuration - failover-relevant parameters annotated.
; (The compose snippet uses the image's env-based config for simplicity;
; mount this file instead for the full-control variant.)
[databases]
* = host=haproxy port=5000

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20

; How quickly the pooler retries a failed backend connection. Default 15s
; adds directly to observed RTO; 1-3s is reasonable behind Patroni.
server_login_retry = 3

; How long client queries may queue while the backend is unavailable.
; This is your application's patience budget during a failover.
query_wait_timeout = 120

; Close server connections that erred (forces reconnect to the new primary).
server_reset_query_always = 0
